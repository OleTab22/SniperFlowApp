name: Android Build & Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17 and Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # CI only checks compilation, unit tests and lint. This synthetic
      # Firebase configuration is not connected to a real Firebase project.
      # A real Firebase project configuration is still needed to run auth
      # and other Firebase-backed functionality on an actual device.
      - name: Provide CI-only Firebase configuration
        run: cp .github/ci/google-services.ci.json app/google-services.json

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew --no-daemon :app:lintDebug
