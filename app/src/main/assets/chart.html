<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
    <title>Chart</title>
    <style>
      html, body, #wrap, iframe {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background: #0B0B10;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <iframe
        id="chart"
        src="https://s.tradingview.com/widgetembed/?symbol=OANDA:XAUUSD&interval=60&theme=dark&style=1&hide_top_toolbar=0&hide_side_toolbar=0&allow_symbol_change=0&autosize=1&studies=RSI@tv-basicstudies,MAExp@tv-basicstudies&support_host=www.tradingview.com"
        style="width:100%;height:100%" allow="fullscreen" referrerpolicy="no-referrer"></iframe>
    </div>
    <script>
      window.setResolutionFromAndroid = function(res) {
        try {
          var i = document.getElementById('chart');
          var u = new URL(i.src);
          u.searchParams.set('interval', res);
          i.src = u.toString();
        } catch (e) { console.log('setResolution error', e); }
      }
      window.setSymbolFromAndroid = function(sym, res) {
        try {
          var i = document.getElementById('chart');
          var u = new URL(i.src);
          u.searchParams.set('symbol', sym);
          if (res) u.searchParams.set('interval', res);
          i.src = u.toString();
        } catch (e) { console.log('setSymbol error', e); }
      }
    </script>
  </body>
  </html>
