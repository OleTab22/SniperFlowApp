services:
  - type: web
    name: sniperflow-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PRICE_SOURCE
        value: auto
      # Optional provider keys (set values in Render dashboard or here if okay to commit)
      - key: ALPHAVANTAGE_API_KEY
        generateValue: true
      - key: TWELVEDATA_API_KEY
        generateValue: true
    healthCheckPath: /health
    autoDeploy: true

