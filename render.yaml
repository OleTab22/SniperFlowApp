services:
  - type: web
    name: sniperflow-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PRICE_SOURCE
        value: auto
      - key: DATABASE_URL
        fromDatabase:
          name: sniperflow-db
          property: connectionString
      # Optional provider keys (set values in Render dashboard or here if okay to commit)
      - key: ALPHAVANTAGE_API_KEY
        generateValue: true
      - key: TWELVEDATA_API_KEY
        generateValue: true
      - key: FRED_API_KEY
        generateValue: true
      - key: GOLDAPI_KEY
        generateValue: true
      # ML Collection (optional: adjust interval)
      - key: ML_COLLECTION_INTERVAL
        value: 300  # seconds (5 minutes)
    healthCheckPath: /v1/health
    autoDeploy: true

databases:
  - name: sniperflow-db
    plan: free
    region: oregon

